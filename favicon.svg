<!-- Outrun sun, matching the icon script.js puts on the theme toggle and the
     backdrop style.css draws behind the page. Deliberately fixed colours: it is
     the Synthwave edition's mark, not a themed element. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd152"/>
      <stop offset="42%" stop-color="#ff9838"/>
      <stop offset="100%" stop-color="#ff3f72"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#332a52"/>
  <circle cx="32" cy="32" r="27" fill="#6d3d73"/>
  <circle cx="32" cy="32" r="21" fill="url(#sun)"/>
  <g fill="#6d3d73">
    <rect x="4" y="33.2" width="56" height="2"/>
    <rect x="4" y="38.2" width="56" height="2.6"/>
    <rect x="4" y="43.8" width="56" height="3.2"/>
    <rect x="4" y="50.0" width="56" height="3.8"/>
  </g>
</svg>
